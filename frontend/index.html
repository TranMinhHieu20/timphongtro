<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('timphongonline.theme') || 'system'; } catch {}
        const resolved = theme === 'light' || theme === 'dark' ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logoTitle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tìm phòng trọ tại Hà Nội theo khu vực, ngân sách và nhu cầu. Xem ảnh, lưu phòng yêu thích và đặt lịch xem phòng." />
    <title>timphongonline - Tìm phòng trọ & Nhận hoàn tiền</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
